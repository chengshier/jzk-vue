name: jk-v31-d-register-performance-period
on:
  push:
    branches: [feat/jzk-v3.1-phase3-operations]
    paths: ['.github/workflows/jk-v31-d-register-performance-period.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jzk-v3.1-phase3-operations
          fetch-depth: 0
      - name: Register performance period route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/router/modules/jkBusiness.js')
          s=p.read_text(encoding='utf-8')
          anchor="    { path: 'performanceRecord', component: () => import('@/views/jkBusiness/performanceRecord/index'), name: 'jkPerformanceRecord', meta: { title: '业绩明细', section: 'finance' } },"
          line="    { path: 'performancePeriod', component: () => import('@/views/jkBusiness/performancePeriod/index'), name: 'jkPerformancePeriod', meta: { title: '周期业绩与阶梯奖励', section: 'finance' } },\n"
          if "path: 'performancePeriod'" not in s:
              if anchor not in s: raise SystemExit('route anchor missing')
              s=s.replace(anchor,line+anchor,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/jk-v31-d-register-performance-period.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/router/modules/jkBusiness.js .github/workflows/jk-v31-d-register-performance-period.yml
          git commit -m 'feat(jzk-v3.1-d): 注册周期业绩管理路由'
          git push origin HEAD:feat/jzk-v3.1-phase3-operations
