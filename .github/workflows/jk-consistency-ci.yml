name: Jiuzhoukang admin CI

on:
  push:
    branches:
      - fix/jk-business-consistency
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build production bundle
        run: npm run build:prod
